<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beheerdersoverzicht</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Beheerdersoverzicht</h1>

    <nav>
        <ul>
            <li><a href="index.html">Website bekijken</a></li>
        </ul>
    </nav>
</header>

<main id="beheerPagina" style="display: none;">

    <section class="aanvragen-section">

    <h2>📩 Offerteaanvragen</h2>

    <p>
        Hier zie je de aanvragen die via het contactformulier zijn verstuurd.
    </p>

    <div id="aanvragenLijst">
        <p>Aanvragen worden geladen...</p>
    </div>

</section>

</main>


<!-- Supabase JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://vzqpfikymnvowdypbpnb.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_HeLNv4p7Fc3gAzp5jHOk7Q_zPDxNaQB";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // =====================================
    // CONTROLEER LOGIN + ADMINROL
    // =====================================
async function laadAanvragen() {

    const aanvragenLijst =
        document.getElementById("aanvragenLijst");


    // Aanvragen ophalen uit Supabase
    const { data: aanvragen, error } =
        await supabaseClient
            .from("offerte_aanvragen")
            .select("*")
            .order("created_at", { ascending: false });


    if (error) {

        console.error("Fout bij ophalen aanvragen:", error);

        aanvragenLijst.innerHTML =
            "<p>De aanvragen konden niet worden geladen.</p>";

        return;
    }


    // Geen aanvragen
    if (!aanvragen || aanvragen.length === 0) {

        aanvragenLijst.innerHTML =
            "<p>Er zijn nog geen offerteaanvragen.</p>";

        return;
    }


    aanvragenLijst.innerHTML = "";


    // Iedere aanvraag weergeven
    aanvragen.forEach(function(aanvraag) {

        const kaart = document.createElement("div");

        kaart.className = "aanvraag-card";


        const datum = new Date(
            aanvraag.created_at
        ).toLocaleString("nl-NL");


        kaart.innerHTML = `
            <div class="aanvraag-header">

                <h3>${escapeHtml(aanvraag.onderwerp || "Geen onderwerp")}</h3>

                <span class="status-badge">
                    ${escapeHtml(aanvraag.status || "nieuw")}
                </span>

            </div>

            <p>
                <strong>Naam:</strong>
                ${escapeHtml(aanvraag.naam)}
            </p>

            <p>
                <strong>E-mail:</strong>
                ${escapeHtml(aanvraag.email)}
            </p>

            <p>
                <strong>Datum:</strong>
                ${datum}
            </p>

            <p>
                <strong>Bericht:</strong><br>
                ${escapeHtml(aanvraag.bericht)}
            </p>
        `;


        aanvragenLijst.appendChild(kaart);

    });

}
    
    function escapeHtml(tekst) {

    const div = document.createElement("div");

    div.textContent = tekst ?? "";

    return div.innerHTML;
}
    
    async function controleerBeheerder() {

        // 1. Controleer of iemand is ingelogd
        const { data: userData, error: userError } =
            await supabaseClient.auth.getUser();


        if (userError || !userData.user) {
            window.location.replace("login.html");
            return;
        }


        const gebruiker = userData.user;


        // 2. Profiel van deze gebruiker ophalen
        const { data: profiel, error: profielError } =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq("id", gebruiker.id)
                .single();


        // 3. Kon profiel niet worden opgehaald?
        if (profielError) {

            console.error("Profiel fout:", profielError);

            alert("Je hebt geen toegang tot het beheerdersoverzicht.");

            window.location.replace("index.html");

            return;
        }


        // 4. Controleer adminrol
        if (profiel.role !== "admin") {

            alert("Je bent geen beheerder.");

            window.location.replace("index.html");

            return;
        }


        // 5. Alles klopt: dashboard tonen
        document
            .getElementById("beheerPagina")
            .style.display = "block";


        document
            .getElementById("userEmail")
            .textContent =
            "Ingelogd als beheerder: " + gebruiker.email;
        await laadAanvragen();
    }


    controleerBeheerder();


    // =====================================
    // UITLOGGEN
    // =====================================

    document
        .getElementById("logoutButton")
        .addEventListener("click", async function() {

            await supabaseClient.auth.signOut();

            window.location.replace("login.html");

        });

</script>
</body>
</html>
