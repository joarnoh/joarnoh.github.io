<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beheerdersoverzicht</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Beheerdersoverzicht</h1>

    <nav>
        <ul>
            <li><a href="index.html">Website bekijken</a></li>
        </ul>
    </nav>
</header>

<main id="beheerPagina" style="display: none;">

    <section>
        <h2>Dashboard</h2>

        <p>
            Welkom in het beheerdersoverzicht.
        </p>

        <p id="userEmail"></p>

        <button id="logoutButton">
            Uitloggen
        </button>
    </section>

</main>


<!-- Supabase JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://vzqpfikymnvowdypbpnb.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_HeLNv4p7Fc3gAzp5jHOk7Q_zPDxNaQB";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // =====================================
    // CONTROLEER LOGIN + ADMINROL
    // =====================================

    async function controleerBeheerder() {

        // 1. Controleer of iemand is ingelogd
        const { data: userData, error: userError } =
            await supabaseClient.auth.getUser();


        if (userError || !userData.user) {
            window.location.replace("login.html");
            return;
        }


        const gebruiker = userData.user;


        // 2. Profiel van deze gebruiker ophalen
        const { data: profiel, error: profielError } =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq("id", gebruiker.id)
                .single();


        // 3. Kon profiel niet worden opgehaald?
        if (profielError) {

            console.error("Profiel fout:", profielError);

            alert("Je hebt geen toegang tot het beheerdersoverzicht.");

            window.location.replace("index.html");

            return;
        }


        // 4. Controleer adminrol
        if (profiel.role !== "admin") {

            alert("Je bent geen beheerder.");

            window.location.replace("index.html");

            return;
        }


        // 5. Alles klopt: dashboard tonen
        document
            .getElementById("beheerPagina")
            .style.display = "block";


        document
            .getElementById("userEmail")
            .textContent =
            "Ingelogd als beheerder: " + gebruiker.email;
    }


    controleerBeheerder();


    // =====================================
    // UITLOGGEN
    // =====================================

    document
        .getElementById("logoutButton")
        .addEventListener("click", async function() {

            await supabaseClient.auth.signOut();

            window.location.replace("login.html");

        });

</script>
</body>
</html>
