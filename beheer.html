<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beheerdersoverzicht</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Beheerdersoverzicht</h1>

    <nav>
        <ul>
            <li><a href="index.html">Website bekijken</a></li>
        </ul>
    </nav>
</header>

<main id="beheerPagina" style="display: none;">

    <section>
        <h2>Dashboard</h2>

        <p>
            Welkom in het beheerdersoverzicht.
        </p>

        <p id="userEmail"></p>

        <button id="logoutButton">
            Uitloggen
        </button>
    </section>

</main>


<!-- Supabase JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://vzqpfikymnvowdypbpnb.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_HeLNv4p7Fc3gAzp5jHOk7Q_zPDxNaQB";


    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // Controleer de gebruiker bij het openen
    async function controleerGebruiker() {

        const { data, error } =
            await supabaseClient.auth.getUser();


        // Geen geldige gebruiker?
        if (error || !data.user) {

            window.location.replace("login.html");

            return;
        }


        // Gebruiker is ingelogd
        document
            .getElementById("beheerPagina")
            .style.display = "block";


        document
            .getElementById("userEmail")
            .textContent =
            "Ingelogd als: " + data.user.email;
    }


    controleerGebruiker();


    // Uitloggen
    document
        .getElementById("logoutButton")
        .addEventListener("click", async function() {

            await supabaseClient.auth.signOut();

            window.location.replace("login.html");

        });

</script>

</body>
</html>
