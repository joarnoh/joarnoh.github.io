<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inloggen - Mijn Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-background"></div>

    <main class="login-wrapper">

        <div class="login-card">

            <div class="login-icon">🔐</div>

            <h1>Welkom terug</h1>

            <p class="login-subtitle">
                Log in om naar het beheerdersoverzicht te gaan
            </p>

            <form id="loginForm">

                <div class="login-input">
                    <label for="email">E-mailadres</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="jouw@email.nl"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="login-input">
                    <label for="password">Wachtwoord</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <!-- CLOUDFLARE TURNSTILE -->
                <div
                    class="cf-turnstile"
                    data-sitekey="0x4AAAAAAE5E6WuSA3biTqTa"
                    data-theme="dark"
                    data-size="flexible"
                    data-callback="onCaptchaSuccess"
                    data-expired-callback="onCaptchaExpired"
                    data-error-callback="onCaptchaError"
                ></div>


                <p id="loginMessage"></p>


                <button
                    type="submit"
                    class="login-submit"
                    id="loginButton"
                >
                    Inloggen
                </button>

            </form>


            <a href="index.html" class="back-home">
                ← Terug naar website
            </a>

        </div>

    </main>


    <!-- CLOUDFLARE TURNSTILE -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer
    ></script>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =====================================
        // SUPABASE
        // =====================================

        const SUPABASE_URL =
            "https://vzqpfikymnvowdypbpnb.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_HeLNv4p7Fc3gAzp5jHOk7Q_zPDxNaQB";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =====================================
        // ELEMENTEN
        // =====================================

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");

        const loginButton =
            document.getElementById("loginButton");


        // =====================================
        // CAPTCHA
        // =====================================

        let captchaToken = null;


        function onCaptchaSuccess(token) {

            captchaToken = token;

            loginMessage.textContent = "";

        }


        function onCaptchaExpired() {

            captchaToken = null;

            loginMessage.textContent =
                "De beveiligingscontrole is verlopen. Probeer opnieuw.";

            loginMessage.style.color =
                "#fbbf24";

        }


        function onCaptchaError() {

            captchaToken = null;

            loginMessage.textContent =
                "De beveiligingscontrole kon niet worden geladen.";

            loginMessage.style.color =
                "#f87171";

        }


        // =====================================
        // INLOGGEN
        // =====================================

        loginForm.addEventListener(
            "submit",

            async function(event) {

                event.preventDefault();


                // Eerst CAPTCHA controleren

                if (!captchaToken) {

                    loginMessage.textContent =
                        "Voltooi eerst de beveiligingscontrole.";

                    loginMessage.style.color =
                        "#fbbf24";

                    return;

                }


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                // Knop tijdelijk blokkeren

                loginButton.disabled = true;

                loginButton.textContent =
                    "Bezig met inloggen...";

                loginMessage.textContent = "";


                // =================================
                // SUPABASE LOGIN + CAPTCHA
                // =================================

                const { data, error } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: password,

                            options: {
                                captchaToken:
                                    captchaToken
                            }

                        });


                // Token is eenmalig
                captchaToken = null;


                // =================================
                // LOGIN MISLUKT
                // =================================

                if (error) {

                    console.error(
                        "Login fout:",
                        error
                    );


                    loginMessage.textContent =
                        "E-mailadres, wachtwoord of beveiligingscontrole is onjuist.";

                    loginMessage.style.color =
                        "#f87171";


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Inloggen";


                    // Nieuwe CAPTCHA maken

                    if (window.turnstile) {

                        turnstile.reset();

                    }


                    return;

                }


                // =================================
                // LOGIN GELUKT
                // =================================

                loginMessage.textContent =
                    "✓ Login gelukt! Je wordt doorgestuurd...";

                loginMessage.style.color =
                    "#4ade80";


                window.location.href =
                    "beheer.html";

            }
        );

    </script>

</body>
</html>
